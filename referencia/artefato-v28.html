<title>Eurotrip 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

<style id="css">
  :root{
    --ground:#F2F4F1;--surface:#FBFCFA;--surface-2:#E8ECE6;
    --ink:#141C18;--ink-2:#3D4A43;--muted:#66756C;
    --hairline:#D3DACF;--hairline-2:#BDC7B9;
    --pine:#1F4D3D;--pine-wash:#E2EBE4;
    --ochre:#96690F;--ochre-wash:#F2EAD6;
    --rust:#9E3A2C;--rust-wash:#F5E4E0;
    --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --body:"Source Serif 4",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --c-es:#1F4D3D;--c-pt:#2C6E63;--c-fr:#34618A;
    --c-nl:#B06A16;--c-de:#7A5C1F;--c-pl:#9E3A2C;--c-it:#6B4E8C;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0F1512;--surface:#161E19;--surface-2:#1D2721;
    --ink:#E4EAE4;--ink-2:#B9C4BC;--muted:#8B998F;
    --hairline:#29352E;--hairline-2:#3A4941;
    --pine:#63B893;--pine-wash:#16251E;
    --ochre:#D8A94F;--ochre-wash:#241E11;
    --rust:#E08975;--rust-wash:#2A1815;
    --c-es:#63B893;--c-pt:#5FB8A8;--c-fr:#79ABD6;
    --c-nl:#DFA254;--c-de:#CBAE63;--c-pl:#E08975;--c-it:#A891CC;
  }}
  :root[data-theme="dark"]{
    --ground:#0F1512;--surface:#161E19;--surface-2:#1D2721;
    --ink:#E4EAE4;--ink-2:#B9C4BC;--muted:#8B998F;
    --hairline:#29352E;--hairline-2:#3A4941;
    --pine:#63B893;--pine-wash:#16251E;
    --ochre:#D8A94F;--ochre-wash:#241E11;
    --rust:#E08975;--rust-wash:#2A1815;
    --c-es:#63B893;--c-pt:#5FB8A8;--c-fr:#79ABD6;
    --c-nl:#DFA254;--c-de:#CBAE63;--c-pl:#E08975;--c-it:#A891CC;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--pine);outline-offset:2px}

  /* ---- shell ---- */
  .top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--hairline)}
  .topin{max-width:1000px;margin:0 auto;padding:14px 24px 0}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
  .brand .save{margin-left:auto;display:flex;align-items:center;gap:9px}
  .savedot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .savedot.cloud{background:var(--pine)}
  .savedot.dirty{background:var(--ochre)}
  .savetxt{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
  .savebtn{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;padding:6px 12px;border:1px solid var(--pine);color:var(--pine)}
  .savebtn[disabled]{opacity:.4;cursor:default}

  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;padding:11px 15px;color:var(--muted);
    border-bottom:2px solid transparent;white-space:nowrap;flex:0 0 auto}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine)}
  .tabs button:hover{color:var(--ink-2)}

  main{max-width:1000px;margin:0 auto;padding:30px 24px 90px}
  .panelhead{margin-bottom:26px}
  .panelhead h2{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.028em;line-height:1.04;margin-bottom:8px}
  .panelhead p{margin:0;color:var(--ink-2);max-width:66ch;font-size:17px}

  /* ---- chips ---- */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
  .chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;
    padding:7px 12px;border:1px solid var(--hairline-2);color:var(--ink-2);background:var(--surface)}
  .chip[aria-pressed="true"]{background:var(--cc,var(--pine));border-color:var(--cc,var(--pine));color:var(--ground)}
  .chip .cn{opacity:.62;margin-left:6px;font-weight:400}

  /* ---- cards ---- */
  .card{border:1px solid var(--hairline-2);background:var(--surface);
    border-top:4px solid var(--cc,var(--pine));margin-bottom:22px}
  .card > .h{padding:20px 24px 16px;border-bottom:1px solid var(--hairline)}
  .card > .h h3{font-size:24px;font-weight:800;letter-spacing:-.024em;margin-bottom:5px}
  .card > .h .m{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card > .b{padding:20px 24px}
  .card > .b > *:first-child{margin-top:0}
  .card > .b p{margin:0 0 10px;color:var(--ink-2);max-width:72ch}
  .card > .b p:last-child{margin-bottom:0}
  .card strong{color:var(--ink);font-weight:600}
  .sechead{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.15em;
    text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

  /* ---- day ---- */
  .day{display:grid;grid-template-columns:92px 1fr;gap:0 20px;padding:16px 0;
    border-bottom:1px solid var(--hairline);align-items:start}
  .day:last-child{border-bottom:0}
  .day .dt{font-family:var(--mono);font-variant-numeric:tabular-nums;padding-top:2px}
  .day .dt b{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
  .day .dt i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin-top:2px}
  .day h4{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-bottom:5px}
  .day p{margin:0 0 7px;font-size:15.5px;color:var(--ink-2);max-width:72ch}
  .day p:last-child{margin-bottom:0}
  .day strong{color:var(--ink);font-weight:600}
  .day--move{background:var(--surface-2)}
  .day--move h4{color:var(--muted);font-weight:600}
  .day--anchor .dt b{color:var(--pine)}
  .day--today{background:var(--pine-wash)}

  .tg{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
  .tg span{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;padding:3px 7px;border:1px solid currentColor}
  .tg .free{color:var(--pine)}.tg .book{color:var(--rust)}
  .tg .fixed{color:var(--ochre)}.tg .move{color:var(--muted)}

  .n{margin:9px 0 0;padding:11px 14px;background:var(--ground);
    border-left:3px solid var(--nc,var(--muted));font-size:14.5px;color:var(--ink-2);max-width:72ch}
  .day--move .n,.day--today .n{background:var(--surface)}
  .n b{color:var(--ink);font-weight:600}
  .n > b:first-child{display:block;font-family:var(--mono);font-size:9px;font-weight:600;
    letter-spacing:.13em;text-transform:uppercase;color:var(--nc,var(--muted));margin-bottom:4px}
  .n.free{--nc:var(--pine)}.n.warn{--nc:var(--ochre)}.n.alert{--nc:var(--rust)}

  /* ---- lists ---- */
  ul.pl{margin:0;padding:0;list-style:none;display:grid;gap:11px}
  ul.pl li{position:relative;padding-left:22px;font-size:15.5px;color:var(--ink-2)}
  ul.pl li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;
    background:var(--cc,var(--pine))}
  ul.pl li .pr{font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-weight:600;color:var(--pine);white-space:nowrap}
  ul.pl li b{color:var(--ink);font-weight:600}
  ul.pl li em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);
    display:block;margin-top:2px}

  /* ---- calendario ---- */
  .cal{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:26px}
  .mo{border:1px solid var(--hairline);background:var(--surface);padding:16px 18px 18px}
  .mo h4{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .grid7 .wd{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);text-align:center;padding-bottom:4px}
  .cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
    border:1px solid transparent;color:var(--muted);position:relative}
  .cd.off{opacity:.28}
  .cd.trip{border-color:var(--hairline-2);color:var(--ink);background:var(--ground);cursor:pointer}
  .cd.trip:hover{border-color:var(--dc,var(--pine))}
  .cd.sel{background:var(--dc,var(--pine));border-color:var(--dc,var(--pine));color:var(--ground);font-weight:600}
  .cd .pip{position:absolute;bottom:4px;width:5px;height:5px;background:var(--dc,var(--pine))}
  .cd.sel .pip{background:var(--ground)}
  .cd.mvd .pip{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .calleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:10.5px;
    color:var(--muted);margin-top:12px}
  .calleg span{display:inline-flex;align-items:center;gap:6px}
  .calleg i{width:7px;height:7px;display:inline-block;font-style:normal;background:var(--muted)}
  .calleg i.d{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

  /* ---- atracoes ---- */
  .at{display:grid;gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-top:10px}
  .atr{background:var(--ground);padding:11px 14px;display:grid;
    grid-template-columns:24px 1fr auto;gap:4px 13px;align-items:start}
  .atr.on{background:var(--pine-wash)}
  .atr input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--pine);cursor:pointer}
  .atr .nm{font-size:15px;font-weight:600;color:var(--ink)}
  .atr .wh{grid-column:2;font-size:13.5px;color:var(--muted);margin-top:1px}
  .atr .vl{font-family:var(--mono);font-size:14px;font-weight:600;
    font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
  .atr.free .vl{color:var(--pine)}
  .atsum{display:flex;flex-wrap:wrap;gap:6px 22px;padding:13px 15px;margin-top:10px;
    background:var(--surface-2);font-family:var(--mono);font-size:12.5px;
    font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .atsum b{color:var(--ink)}
  .bigsum{border:1px solid var(--hairline-2);border-top:4px solid var(--pine);
    background:var(--surface);padding:20px 24px;margin-bottom:24px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px}
  .bigsum > div b{display:block;font-family:var(--display);font-size:27px;font-weight:800;
    letter-spacing:-.026em;font-variant-numeric:tabular-nums;line-height:1}
  .bigsum > div span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted);margin-top:6px}

  /* ---- tables ---- */
  .tw{overflow-x:auto;border:1px solid var(--hairline);background:var(--surface)}
  table{border-collapse:collapse;width:100%;min-width:520px}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--hairline);font-size:15px}
  thead th{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);background:var(--surface-2);
    border-bottom:1px solid var(--hairline-2);white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.pl2{font-weight:600;font-family:var(--display);letter-spacing:-.01em}
  td.sb{font-size:13px;color:var(--muted)}
  tfoot td{font-family:var(--mono);font-weight:600;background:var(--surface-2);
    border-top:1px solid var(--hairline-2)}
  .gr{color:var(--pine);font-weight:600}.rd{color:var(--rust);font-weight:600}
  tr.pk td{background:var(--ochre-wash)}

  /* ---- stay form ---- */
  .form{display:grid;gap:12px;margin-top:16px}
  .fld{display:grid;gap:5px}
  .fld label{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .fld input,.fld textarea{padding:9px 11px;background:var(--ground);
    border:1px solid var(--hairline-2);font-size:15px;width:100%}
  .fld textarea{min-height:64px;resize:vertical;font-family:var(--body)}
  .fld input:focus,.fld textarea:focus{border-color:var(--pine);outline:none}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .calcline{font-family:var(--mono);font-size:12.5px;color:var(--pine);
    font-variant-numeric:tabular-nums;padding-top:4px}
  .saved{margin-top:14px;padding:13px 15px;background:var(--pine-wash);
    border-left:3px solid var(--pine)}
  .saved .k{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.13em;
    text-transform:uppercase;color:var(--pine);margin-bottom:5px;display:block}
  .saved .v{font-size:15.5px;color:var(--ink);font-weight:600}
  .saved .x{font-size:14px;color:var(--ink-2);margin-top:4px}
  .saved a{color:var(--pine);word-break:break-all;font-size:14px}

  /* ---- booking checklist ---- */
  .bk{display:grid;gap:1px;background:var(--hairline);border:1px solid var(--hairline)}
  .bkr{background:var(--surface);padding:15px 18px;display:grid;
    grid-template-columns:26px 130px 1fr;gap:6px 16px;align-items:start}
  .bkr.done{background:var(--pine-wash)}
  .bkr.done h4,.bkr.done p{opacity:.55}
  .bkr.done h4{text-decoration:line-through}
  .bkr input[type=checkbox]{width:19px;height:19px;margin:3px 0 0;accent-color:var(--pine);cursor:pointer}
  .bkr .w{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;
    color:var(--wc,var(--muted));line-height:1.4;padding-top:2px}
  .bkr h4{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
  .bkr p{margin:0;font-size:14.5px;color:var(--ink-2);max-width:66ch}
  .bkr.now{--wc:var(--rust)}
  .bkr.hard{--wc:var(--ochre)}

  /* ---- dashboard ---- */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:24px}
  .kpi > div{background:var(--surface);padding:18px 20px}
  .kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:800;
    letter-spacing:-.028em;font-variant-numeric:tabular-nums;line-height:1}
  .kpi span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-top:7px}
  .kpi small{display:block;font-size:13px;color:var(--ink-2);margin-top:5px}

  .bar{display:flex;height:38px;overflow:hidden;border:1px solid var(--hairline-2);margin-bottom:10px}
  .bar > div{display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
    color:var(--ground);min-width:0;overflow:hidden}
  .key{display:flex;flex-wrap:wrap;gap:5px 18px;font-family:var(--mono);
    font-size:11px;color:var(--muted);margin-bottom:26px}
  .key span{display:inline-flex;align-items:center;gap:6px}
  .key i{width:9px;height:9px;display:inline-block;font-style:normal}

  footer{max-width:1000px;margin:0 auto;padding:24px;border-top:1px solid var(--hairline);
    font-family:var(--mono);font-size:11px;color:var(--muted);
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

  @media (max-width:700px){
    body{font-size:16px}
    .topin{padding:12px 16px 0}
    main{padding:24px 16px 80px}
    .brand .save{margin-left:0;width:100%}
    .card > .h{padding:16px 18px 14px}
    .card > .b{padding:16px 18px}
    .card > .h h3{font-size:20px}
    .day{grid-template-columns:1fr;gap:7px 0}
    .day .dt{display:flex;align-items:baseline;gap:9px;padding-bottom:5px;
      border-bottom:1px solid var(--hairline)}
    .day .dt i{margin-top:0}
    .frow,.frow3{grid-template-columns:1fr}
    .atr{grid-template-columns:24px 1fr}
    .atr .vl{grid-column:2}
    .bkr{grid-template-columns:26px 1fr}
    .bkr .w{grid-column:2}
    .bkr h4,.bkr p{grid-column:2}
  }
  /* ---- v12: listas editáveis ---- */
  .subtabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
  .mt{display:grid;gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-top:4px}
  .mrow{background:var(--ground);padding:10px 12px;display:grid;
    grid-template-columns:1fr 104px 84px 34px;gap:7px 9px;align-items:center;
    grid-template-areas:"nm st pr x" "wh wh wh wh"}
  .mrow .sv{grid-area:st;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
    padding:6px 4px;text-align:center;text-align-last:center}
  .mrow.st-esc{background:var(--pine-wash);box-shadow:inset 3px 0 0 var(--pine)}
  .mrow.st-esc .sv{color:var(--pine);font-weight:600;border-color:var(--pine)}
  .mrow.st-bac{box-shadow:inset 3px 0 0 var(--ochre)}
  .mrow.st-bac .sv{color:var(--ochre)}
  .mrow.st-sug{background:var(--surface-2)}
  .mrow.st-sug .nv,.mrow.st-sug .wh{opacity:.62}
  .mrow.st-sug .sv{color:var(--muted)}

  .filt{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px}
  .fchip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;
    padding:7px 12px;border:1px solid var(--hairline-2);color:var(--ink-2);background:var(--surface)}
  .fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
  .fchip.f-esc[aria-pressed="true"]{background:var(--pine);border-color:var(--pine)}
  .fchip.f-bac[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre)}
  .fchip .cn{opacity:.62;margin-left:6px;font-weight:400}
  .mrow.food{grid-template-columns:1fr 34px;grid-template-areas:"nm x" "wh wh"}
  .mrow.x3{grid-template-columns:1fr 96px 62px 34px;
    grid-template-areas:"nm pr cu x" "wh wh wh wh"}
  .mrow .nv{grid-area:nm}
  .mrow .pv{grid-area:pr}
  .mrow select{grid-area:cu}
  .mrow .xb{grid-area:x}
  .mrow .wh{grid-area:wh;font-size:13.5px;color:var(--muted);line-height:1.45}
  .mrow input,.mrow select{padding:7px 9px;background:var(--surface);
    border:1px solid var(--hairline-2);font-size:15px;width:100%}
  .mrow input:focus,.mrow select:focus{border-color:var(--pine);outline:none}
  .mrow input.pv{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .mrow .pv:placeholder-shown{background:transparent;border-color:transparent}
  .mrow:hover .pv:placeholder-shown{border-color:var(--hairline)}
  .mrow .pv:focus{background:var(--surface);border-color:var(--pine)}
  .nv{background:transparent!important;border-color:transparent!important;
    font-weight:600;color:var(--ink);padding-left:2px!important;padding-right:2px!important;
    text-overflow:ellipsis}
  .mrow:hover .nv,.bkr:hover .nv{border-color:var(--hairline)!important}

function blocks(){
  var out=[],cur=null;
  for(var i=0;i<ISOS.length;i++){

var FKPL={pr:"pratos",rest:"restaurantes",cafe:"caf\u00e9s"};
var FKORD={pr:0,rest:1,cafe:2};
function fkOf(it){return FK[it.k]?it.k:"pr";}
function foodsOf(co){return S.foods[co]||[];}
function foodsK(co,k){var a=foodsOf(co),o=[],i;

function foodCount(co,k){return k?foodsK(co,k).length:foodsOf(co).length;}
function findFood(co,id){var a=foodsOf(co);

function foodsOfDay(iso){

function foodPlaced(){var n=0,c,i;

/* mesma faxina do pruneDays, para comida */
function pruneFoodDays(){var c,i,ok={};

/* ---- atração ↔ dia (v24) ---- */
function norm(v){return String(v||"").toLowerCase()
  .replace(/[\u00e1\u00e0\u00e2\u00e3\u00e4]/g,"a").replace(/[\u00e9\u00e8\u00ea\u00eb]/g,"e")
  .replace(/[\u00ed\u00ec\u00ee\u00ef]/g,"i").replace(/[\u00f3\u00f2\u00f4\u00f5\u00f6]/g,"o")
  .replace(/[\u00fa\u00f9\u00fb\u00fc]/g,"u").replace(/\u00e7/g,"c")
  .replace(/[^a-z0-9]/g,"");}
/* a base do dia é texto livre: "Lisboa", "Amsterdã", "em trânsito"... */
function cityOfBase(b){
  var n=norm(b),k;
  if(!n)return"";
  if(CT[n])return n;
  for(k in CT)if(norm(CT[k].n)===n)return k;
  for(k in CT){var c=norm(CT[k].n);if(c.length>3&&(n.indexOf(c)>=0||c.indexOf(n)>=0))return k;}
  return"";
}
function dayOfIt(it){return it.day||"";}
function itemsOfDay(iso){
  var out=[],c,i;

    for(i=0;i<a.length;i++)if(a[i].day===iso)out.push({city:c,it:a[i]});}
  out.sort(function(x,y){return STORD[stOf(x.it)]-STORD[stOf(y.it)];});
  return out;
}

function placedCount(){var n=0,c,i;

    for(i=0;i<a.length;i++)if(a[i].day)n++;}
  return n;}
/* limpa o dia de atrações que apontam para um dia que não existe mais */
function pruneDays(){var c,i,ok={};
  for(i=0;i<ISOS.length;i++)ok[ISOS[i]]=1;
  for(c in S.mine){var a=S.mine[c]||[];
    for(i=0;i<a.length;i++)if(a[i].day&&!ok[a[i].day])a[i].day="";}}

function nightsAll(){var a=baseList(),s=0;for(var i=0;i<a.length;i++)s+=a[i].nt;return s;}
/* dias em terra (dentro de alguma base) e dias só de voo */
function groundDays(){var a=baseList(),s=0;for(var i=0;i<a.length;i++)s+=a[i].d;return s;}
function flyDays(){return Math.max(0,ISOS.length-groundDays());}
function brl(v){return "R$ "+(Math.round(v)).toLocaleString("pt-BR");}
function eur(v){return "€ "+(Math.round(v*100)/100).toLocaleString("pt-BR");}
function resDone(){var n=0;for(var i=0;i<S.res.length;i++)if(S.resdone[S.res[i].id])n++;return n;}
/* v26: cada reserva tem valor. Marcada = já paga, e entra no "total já pago". */
function resSum(mode){
  var e=0,b=0,i;
  for(i=0;i<S.res.length;i++){
    var r=S.res[i],d=!!S.resdone[r.id];
    if(mode==="pago"&&!d)continue;

}

function resCount(mode){var n=0,i;

   Os trechos sairam de Custos e ganharam aba propria: tipo, dia e "comprado".

/* ---- as cidades que dá para puxar: a base do dia primeiro, depois o resto ---- */
function pickCities(baseKey){
  var out=[],i,j,seen={};
  if(baseKey){out.push(baseKey);seen[baseKey]=1;}
  if(baseKey&&CT[baseKey]){var co=coOf(CT[baseKey].co);
    for(i=0;i<co.cities.length;i++)if(!seen[co.cities[i]]){out.push(co.cities[i]);seen[co.cities[i]]=1;}}
  for(i=0;i<CO.length;i++)for(j=0;j<CO[i].cities.length;j++)
    if(!seen[CO[i].cities[j]]){out.push(CO[i].cities[j]);seen[CO[i].cities[j]]=1;}
  return out;
}
function freeCount(city,iso){
  var a=mineOf(city),n=0;
  for(var i=0;i<a.length;i++)if(!a[i].day)n++;

}

/* ============ ROTEIRO (calendário + blocos, a antiga aba Dias entrou aqui) ============ */
function dayRow(iso,click){
  var d=dayOf(iso),has=hasPlan(iso);
  return '<div class="day'+(has?"":" day--move")+(click?" day--pick":"")+'"'+
    (click?' data-iso="'+iso+'" role="button" tabindex="0"':'')+'>'+
    '<div class="dt"><b>'+shortDt(iso)+'</b><i>'+wdOf(iso)+'</i></div><div>'+
    (d.c&&d.c.trim()?'':'<h4>— sem base</h4>')+
    (d.p&&d.p.trim()?'<p>'+esc(d.p)+'</p>':'<p style="color:var(--muted)">clique para escrever</p>')+
    dayTags(iso)+
    (DAYNOTE[iso]?'<div class="ntags"><span class="ntg nt-'+DAYNOTE[iso][0]+'">'+DAYNOTE[iso][1]+'</span></div>':'')+
    '</div></div>';

/* o que está marcado para o dia, em linha. O emoji diz o que é cada coisa:
   trem/voo, passeio a pé, tour, restaurante, café. */
function dayTags(iso){
  var a=itemsOfDay(iso),f=foodsOfDay(iso),tr=trOfDay(iso),h="",i;
  if(!a.length&&!f.length&&!tr.length)return"";
  h='<div class="dtags">';
  for(i=0;i<tr.length;i++){var t=tr[i],k=tkOf(t),v=num(t.v);
    h+='<span class="dtg tk-'+k+(t.ok?" pgo":"")+'">'+TKE[k]+' '+esc(t.n)+
       (v?' <b>'+(t.m==="brl"?brl(v):eur(v))+'</b>':'')+'</span>';}
  for(i=0;i<a.length;i++)h+='<span class="dtg st-'+stOf(a[i].it)+'">'+AKE[akOf(a[i].it)]+' '+esc(a[i].it.n)+
    (num(a[i].it.pr)?' <b>'+eur(num(a[i].it.pr))+'</b>':'')+'</span>';
  for(i=0;i<f.length;i++)h+='<span class="dtg fk-'+fkOf(f[i].it)+'">'+FKE[fkOf(f[i].it)]+' '+esc(f[i].it.n)+'</span>';
  var tot=dayAttrTotal(iso)+dayTrTotal(iso);
  if(tot)h+='<span class="dtg tot">'+eur(tot)+' no dia</span>';
  return h+'</div>';
}

/* ============ SHELL ============ */
var TABS=[["painel","Painel"],["roteiro","Roteiro"],["atracoes","Atrações"],
          ["comidas","Comidas"],["transporte","Transporte"],["stay","Hospedagem"],
          ["reservas","Reservas"],["caixa","Caixa"],["custos","Custos"]];
var app=document.getElementById("app");

function shell(){
  var h='<header class="top"><div class="topin"><div class="brand">'+
    '<h1>Eurotrip 2026</h1><span class="sub">10 dez 2026 — 12 jan 2027</span>'+
    '<span class="save" id="savebox"></span></div><nav class="tabs" role="tablist">';
  for(var i=0;i<TABS.length;i++)
    h+='<button role="tab" data-tab="'+TABS[i][0]+'" aria-selected="'+(tab===TABS[i][0])+'">'+TABS[i][1]+'</button>';
  h+='</nav></div></header><main id="main"></main>'+
    '<footer><span>o plano é seu — eu guardo, pesquiso e faço as contas</span><span class="mono">v28</span></footer>';
  app.innerHTML=h;
}

function findMine(city,id){var a=mineOf(city);for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function refreshCalc(city){
  var el=document.querySelector('[data-calc="'+city+'"]');if(!el)return;
  var st=stayOf(city),tot=stayTotal(city),to=num(st.total);
  el.textContent=tot?((to?"total lançado":"diária × noites")+": "+eur(tot)+" · "+brl(tot*num(S.rate))):"";
}

function render(){
  shell();
  var m=document.getElementById("main");
  if(tab==="painel")m.innerHTML=viewPainel();
  else if(tab==="roteiro")m.innerHTML=viewRoteiro();
  else if(tab==="atracoes")m.innerHTML=viewAtracoes();
  else if(tab==="comidas")m.innerHTML=viewComidas();
  else if(tab==="transporte")m.innerHTML=viewTransporte();
  else if(tab==="stay")m.innerHTML=viewStay();
  else if(tab==="reservas")m.innerHTML=viewReservas();
  else if(tab==="caixa")m.innerHTML=viewCaixa();
  else m.innerHTML=viewCustos();

  /* 9 abas nao cabem num celular: traz a ativa para a vista, sem rolar a pagina */
  try{var sel=app.querySelector('.tabs button[aria-selected="true"]');
    if(sel&&sel.scrollIntoView)sel.scrollIntoView({inline:"center",block:"nearest"});}catch(x){}
  var tb=app.querySelectorAll(".tabs button");
  for(var j=0;j<tb.length;j++)tb[j].onclick=function(){
    tab=this.getAttribute("data-tab");
    try{localStorage.setItem(LS+"-tab",tab);}catch(x){}
    render();window.scrollTo(0,0);
  };

  /* país (sub-abas) */
  each(m,".subtabs [data-co]",function(el){
    el.onclick=function(){selCO=this.getAttribute("data-co");
      try{localStorage.setItem(LS+"-co",selCO);}catch(x){}
      render();window.scrollTo(0,0);};
  });

  /* calendário e lista de dias */
  each(m,"[data-iso]",function(el){
    if(el.hasAttribute("data-pk")||el.hasAttribute("data-fpk")||el.hasAttribute("data-tpk"))return;
    var go=function(){selDay=el.getAttribute("data-iso");selPick=null;selFPick=null;selTPick=null;render();window.scrollTo(0,0);};
    el.onclick=go;
    el.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go();}};
  });
  each(m,"[data-nav]",function(el){el.onclick=function(){
    var v=this.getAttribute("data-nav");selDay=(v==="all"?null:v);selPick=null;selFPick=null;selTPick=null;render();window.scrollTo(0,0);};});
  /* atração ↔ dia */
  each(m,"[data-pick]",function(el){el.onclick=function(){
    selPick=this.getAttribute("data-pick");render();};});
  each(m,"[data-pk]",function(el){el.onclick=function(){
    var it=findMine(this.getAttribute("data-city"),this.getAttribute("data-pk"));if(!it)return;
    it.day=this.getAttribute("data-iso");
    if(stOf(it)!=="esc")it.st="esc";   /* pôr num dia é escolher */
    touch();render();};});
  each(m,"[data-unpk]",function(el){el.onclick=function(){
    var it=findMine(this.getAttribute("data-city"),this.getAttribute("data-unpk"));if(!it)return;
    it.day="";touch();render();};});

  /* editor do dia */
  each(m,"[data-dc]",function(el){el.oninput=function(){
    var iso=this.getAttribute("data-dc");S.days[iso]=S.days[iso]||{};S.days[iso].c=this.value;touch();};});
  each(m,"[data-dp]",function(el){el.oninput=function(){
    var iso=this.getAttribute("data-dp");S.days[iso]=S.days[iso]||{};S.days[iso].p=this.value;touch();};});
  /* apaga só o texto dele. A base é o roteiro fechado e fica. */
  each(m,"[data-dclr]",function(el){el.onclick=function(){
    var iso=this.getAttribute("data-dclr");
    if(S.days[iso])S.days[iso].p="";
    touch();render();};});

  /* atrações — itens dele */
  each(m,"[data-mi]",function(el){el.oninput=function(){
    var it=findMine(this.getAttribute("data-city"),this.getAttribute("data-id"));if(!it)return;
    it[this.getAttribute("data-mi")]=this.value;touch();
    if(this.getAttribute("data-mi")==="pr")refreshSums();};});
  each(m,"[data-mx]",function(el){el.onclick=function(){
    var city=this.getAttribute("data-city"),id=this.getAttribute("data-mx"),a=mineOf(city);
    for(var i=0;i<a.length;i++)if(a[i].id===id){
      if(a[i].sid)S.killed[a[i].sid]=1;
      a.splice(i,1);break;}
    touch();render();};});
  each(m,"[data-madd]",function(el){el.onclick=function(){
    var city=this.getAttribute("data-madd");
    var ni=m.querySelector('[data-nadd="'+city+'"]'),pi=m.querySelector('[data-padd="'+city+'"]');
    var nm=ni?ni.value.trim():"";if(!nm)return;
    S.mine[city]=S.mine[city]||[];
    S.mine[city].push({id:uid("m"),n:nm,pr:pi?pi.value.trim():"",w:"",st:"bac"});
    touch();render();};});
  each(m,"[data-st]",function(el){el.onchange=function(){
    var it=findMine(this.getAttribute("data-city"),this.getAttribute("data-id"));
    if(!it)return;it.st=this.value;touch();render();};});
  /* v28: passeio ou tour */
  each(m,"[data-ak]",function(el){el.onchange=function(){
    var it=findMine(this.getAttribute("data-city"),this.getAttribute("data-id"));
    if(!it)return;it.k=this.value;touch();render();};});
  each(m,"[data-filt]",function(el){el.onclick=function(){
    filt=this.getAttribute("data-filt");render();};});

  /* comidas */
  each(m,"[data-fi]",function(el){el.oninput=function(){
    var a=S.foods[this.getAttribute("data-co")]||[],id=this.getAttribute("data-id");
    for(var i=0;i<a.length;i++)if(a[i].id===id){a[i][this.getAttribute("data-fi")]=this.value;break;}
    touch();};});
  each(m,"[data-fx]",function(el){el.onclick=function(){
    var k=this.getAttribute("data-co"),id=this.getAttribute("data-fx"),a=S.foods[k]||[];
    for(var i=0;i<a.length;i++)if(a[i].id===id){a.splice(i,1);break;}
    touch();render();};});
  each(m,"[data-fadd]",function(el){el.onclick=function(){
    var tag=this.getAttribute("data-fadd"),p=tag.split("|"),co=p[0],k=p[1]||"pr";
    var ni=m.querySelector('[data-fadd-n="'+tag+'"]');
    var nm=ni?ni.value.trim():"";if(!nm)return;
    S.foods[co]=S.foods[co]||[];
    S.foods[co].push({id:uid("f"),n:nm,w:"",k:k,day:""});
    touch();render();};});
  /* tipo do item de comida: prato / restaurante / café */
  each(m,"[data-fk]",function(el){el.onchange=function(){
    var it=findFood(this.getAttribute("data-co"),this.getAttribute("data-id"));if(!it)return;
    it.k=this.value;
    if(it.k==="pr")it.day="";   /* prato não tem dia */
    touch();render();};});
  /* comida ↔ dia */
  each(m,"[data-fpick]",function(el){el.onclick=function(){
    selFPick=this.getAttribute("data-fpick");render();};});
  each(m,"[data-fpk]",function(el){el.onclick=function(){
    var it=findFood(this.getAttribute("data-co"),this.getAttribute("data-fpk"));if(!it)return;
    it.day=this.getAttribute("data-iso");touch();render();};});
  each(m,"[data-unfpk]",function(el){el.onclick=function(){
    var it=findFood(this.getAttribute("data-co"),this.getAttribute("data-unfpk"));if(!it)return;
    it.day="";touch();render();};});
  each(m,"[data-fsg]",function(el){el.onclick=function(){
    var sid=this.getAttribute("data-fsg"),k=sid.slice(1).split("|")[0],ix=+sid.split("|")[1];
    var f=null;for(var i=0;i<FOOD.length;i++)if(FOOD[i].pais===k)f=FOOD[i];
    if(!f||!f.reg[ix])return;
    S.foods[k]=S.foods[k]||[];
    S.foods[k].push({id:uid("f"),n:strip(f.reg[ix][0]),w:f.reg[ix][1],k:"pr",day:""});
    S.adopted[sid]=1;touch();render();};});

  /* reservas */
  each(m,"[data-rd]",function(el){el.onchange=function(){
    S.resdone[this.getAttribute("data-rd")]=this.checked;touch();
    /* marcar move o valor de "previsto" para "já pago": tem que recalcular */
    render();};});
  each(m,"[data-ri]",function(el){
    var f=el.getAttribute("data-ri"),id=el.getAttribute("data-id");
    var fn=function(){
      for(var i=0;i<S.res.length;i++)if(S.res[i].id===id){S.res[i][f]=el.value;break;}
      touch();if(f==="v")refreshSums();};
    if(el.tagName==="SELECT")el.onchange=function(){fn();render();};else el.oninput=fn;});
  each(m,"[data-rx]",function(el){el.onclick=function(){
    var id=this.getAttribute("data-rx");
    for(var i=0;i<S.res.length;i++)if(S.res[i].id===id){S.res.splice(i,1);break;}
    delete S.resdone[id];touch();render();};});
  each(m,"[data-radd]",function(el){el.onclick=function(){
    var ni=m.querySelector('[data-radd-n]'),wi=m.querySelector('[data-radd-w]'),
        vi=m.querySelector('[data-radd-v]'),mi=m.querySelector('[data-radd-m]');
    var nm=ni?ni.value.trim():"";if(!nm)return;
    S.res.push({id:uid("r"),n:nm,w:wi?strip(wi.value.trim()):"",
      v:vi?vi.value.trim():"",m:mi?mi.value:"brl"});
    touch();render();};});
  each(m,"[data-rsg]",function(el){el.onclick=function(){
    var sid=this.getAttribute("data-rsg"),ix=+sid.split("|")[1];if(!SUGGRES[ix])return;
    S.res.push({id:uid("r"),n:SUGGRES[ix][0],w:SUGGRES[ix][1]});
    S.adopted[sid]=1;touch();render();};});

  /* custos livres */
  each(m,"[data-xi]",function(el){
    var fn=function(){
      var id=el.getAttribute("data-id");
      for(var i=0;i<S.extra.length;i++)if(S.extra[i].id===id){S.extra[i][el.getAttribute("data-xi")]=el.value;break;}
      touch();refreshSums();};
    if(el.tagName==="SELECT")el.onchange=function(){fn();render();};else el.oninput=fn;});
  each(m,"[data-xx]",function(el){el.onclick=function(){
    var id=this.getAttribute("data-xx");
    for(var i=0;i<S.extra.length;i++)if(S.extra[i].id===id){S.extra.splice(i,1);break;}
    touch();render();};});
  each(m,"[data-xadd]",function(el){el.onclick=function(){
    var ni=m.querySelector("[data-xadd-n]"),vi=m.querySelector("[data-xadd-v]"),mi=m.querySelector("[data-xadd-m]");
    var nm=ni?ni.value.trim():"";if(!nm)return;
    S.extra.push({id:uid("x"),n:nm,v:vi?vi.value.trim():"",m:mi?mi.value:"eur"});
    touch();render();};});
  /* transportes entre bases */
  each(m,"[data-ti]",function(el){
    var fn=function(){
      var it=findTr(el.getAttribute("data-id"));if(!it)return;
      it[el.getAttribute("data-ti")]=el.value;touch();refreshSums();};
    if(el.tagName==="SELECT")el.onchange=function(){fn();render();};else el.oninput=fn;});
  each(m,"[data-tx]",function(el){el.onclick=function(){
    var id=this.getAttribute("data-tx");
    for(var i=0;i<S.tr.length;i++)if(S.tr[i].id===id){
      if(S.tr[i].sid)S.killed[S.tr[i].sid]=1;
      S.tr.splice(i,1);break;}
    touch();render();};});
  each(m,"[data-tadd]",function(el){el.onclick=function(){
    var ni=m.querySelector("[data-tadd-n]"),vi=m.querySelector("[data-tadd-v]"),
        mi=m.querySelector("[data-tadd-m]"),ki=m.querySelector("[data-tadd-k]");
    var nm=ni?ni.value.trim():"";if(!nm)return;
    S.tr.push({id:uid("t"),n:nm,v:vi?vi.value.trim():"",m:mi?mi.value:"eur",
      k:(ki&&TK[ki.value])?ki.value:"trem",day:"",ok:false});
    touch();render();};});
  /* v28: tipo do trecho (trem, voo, onibus, carro) */
  each(m,"[data-tk]",function(el){el.onchange=function(){
    var it=findTr(this.getAttribute("data-id"));if(!it)return;
    it.k=this.value;touch();render();};});
  /* comprou = sai de previsto e entra no total ja pago, entao re-renderiza */
  each(m,"[data-tok]",function(el){el.onchange=function(){
    var it=findTr(this.getAttribute("data-tok"));if(!it)return;
    it.ok=this.checked;touch();render();};});
  /* transporte <-> dia */
  each(m,"[data-tpick]",function(el){el.onclick=function(){
    selTPick=this.getAttribute("data-tpick");render();};});
  each(m,"[data-tpk]",function(el){el.onclick=function(){
    var it=findTr(this.getAttribute("data-tpk"));if(!it)return;
    it.day=this.getAttribute("data-iso");touch();render();};});
  each(m,"[data-untk]",function(el){el.onclick=function(){
    var it=findTr(this.getAttribute("data-untk"));if(!it)return;
    it.day="";touch();render();};});
  /* caixa */
  each(m,"[data-who]",function(el){if(el.hasAttribute("data-cxi")||el.hasAttribute("data-cxa"))return;
    el.onclick=function(){selWho=this.getAttribute("data-who");
      try{localStorage.setItem(LS+"-who",selWho);}catch(x){}render();};});
  each(m,"[data-cxi]",function(el){
    var f=el.getAttribute("data-cxi"),w=el.getAttribute("data-who");
    var fn=function(){
      if(f==="cur")S.cx.cur[w]=el.value; else S.cx[f][w]=el.value;
      touch();};
    if(el.tagName==="SELECT")el.onchange=function(){fn();render();};
    else el.oninput=function(){fn();refreshSums();refreshCx();};});
  each(m,"[data-cxa]",function(el){el.oninput=function(){
    var ym=this.getAttribute("data-cxa"),w=this.getAttribute("data-who");
    S.cx.ap[ym]=S.cx.ap[ym]||{};S.cx.ap[ym][w]=this.value;touch();refreshSums();refreshCx();};});
  each(m,"[data-cxfill]",function(el){el.onclick=function(){
    var w=this.getAttribute("data-cxfill");
    S.cx.meta[w]=String(Math.round(cxCur(w)==="eur"?ESTIM_EUR:ESTIM_EUR*num(S.rate)));
    touch();render();};});
  each(m,"[data-rate]",function(el){el.oninput=function(){
    var v=num(this.value);if(v>0){S.rate=this.value;touch();refreshSums();}};});

  /* hospedagem */
  each(m,".form[data-city] [data-f]",function(el){el.oninput=function(){
    var city=this.closest(".form").getAttribute("data-city"),f=this.getAttribute("data-f");
    S.stays[city]=S.stays[city]||{};S.stays[city][f]=this.value;touch();
    if(f==="diaria"||f==="total"||f==="nt"){refreshCalc(city);refreshSums();}};});

  renderSave();
}

function each(root,sel,fn){var a=root.querySelectorAll(sel);for(var i=0;i<a.length;i++)fn(a[i]);}
function strip(s){var d=document.createElement("div");d.innerHTML=s;return d.textContent||"";}

/* a coluna "acumulado" da Caixa, atualizada no lugar */
function refreshCx(){
  if(tab!=="caixa")return;
  var w=(selWho==="geral"?null:selWho),ms=saveMonths(),i;
  function put(sel,txt){var e=document.querySelector(sel);if(e)e.textContent=txt;}
  var ac=w?cxIni(w):(cxBrl(cxIni("leo"),"leo")+cxBrl(cxIni("lu"),"lu"));
  var fmt=w?function(v){return cxMoney(v,w);}:brl;
  put('[data-cxac="ini"]',ac?fmt(ac):"\u2014");
  var row=document.querySelector('[data-cxrow="ini"]');if(row)row.hidden=!ac;
  for(i=0;i<ms.length;i++){
    var ym=ms[i];
    if(w)ac+=apVal(ym,w);
    else{var mb=cxBrl(apVal(ym,"leo"),"leo")+cxBrl(apVal(ym,"lu"),"lu");
      ac+=mb;put('[data-cxm="'+ym+'"]',mb?brl(mb):"\u2014");}
    put('[data-cxac="'+ym+'"]',ac?fmt(ac):"\u2014");
  }
  if(w){put('[data-cxt="ap"]',cxMoney(cxAportes(w),w));put('[data-cxt="tot"]',cxMoney(cxTotal(w),w));}
  else{put('[data-cxt="leo"]',cxMoney(cxAportes("leo"),"leo"));
    put('[data-cxt="lu"]',cxMoney(cxAportes("lu"),"lu"));
    put('[data-cxt="tot"]',brl(cxTotalBrl()));
    var bb=document.getElementById("cxbar");if(bb)bb.innerHTML=cxBar();}
}

/* atualiza os números grandes sem re-render (não perde o foco do input) */
function refreshSums(){
  var bs=document.querySelector(".bigsum");if(!bs)return;
  var ho=stayTotalAll(),at=attrTotalAll("esc"),rt=num(S.rate),d=bs.children;
  function set(i,big,lab){if(d[i])d[i].innerHTML="<b>"+big+"</b><span>"+lab+"</span>";}
  if(tab==="atracoes"){set(0,eur(attrTotalCO(selCO,"esc")),esc(coOf(selCO).n)+", escolhidas");
    set(1,eur(at),"escolhidas na viagem");set(2,brl(at*rt),"em reais");
    set(3,eur(attrTotalAll("bac")),"o backlog inteiro somaria");}
  else if(tab==="stay"){set(0,stayCount()+"/"+STAYS.length,"com endereço salvo");
    set(1,eur(ho),"diárias cheias somadas");set(2,brl(ho*rt),"em reais");}
  else if(tab==="reservas"){var pg=resBrl("pago"),ft=resBrl("falta");
    set(0,resDone()+"/"+S.res.length,"resolvidas");set(1,brl(pg),"já pago");
    set(2,brl(ft),"previsto, ainda não pago");set(3,brl(pg+ft),"burocracia inteira");}
  else if(tab==="transporte"){var tp=trBrlM("pago"),tf=trBrlM("falta");
    set(0,trDone()+"/"+S.tr.length,"já comprados");set(1,brl(tp),"já pago");
    set(2,brl(tf),"previsto, ainda não pago");set(3,trPlaced()+"/"+S.tr.length,"com dia marcado");}
  else if(tab==="caixa"){
    if(selWho==="geral"){set(0,brl(cxTotalBrl()),"já acumulado");set(1,brl(cxMetaBrl()),"meta dos dois");
      set(2,brl(cxFaltaBrl()),"ainda falta");set(3,brl(cxMes(null)),"por mês, os dois");}
    else{var w=selWho;set(0,cxMoney(cxTotal(w),w),WHO[w]+" já tem");set(1,cxMoney(cxMeta(w),w),"meta");
      set(2,cxMoney(cxFalta(w),w),"ainda falta");set(3,cxMoney(cxMes(w),w),"por mês");
      set(4,cxMoney(cxAportes(w),w),"aportado até agora");}}
  else if(tab==="custos"){var tb=totalBrl();set(0,brl(tb),"total real até agora");
    set(1,eur(ho+at+extraEur()+trEur()),"em euros");set(2,brl(pagoBrl()),"total já pago");
    set(3,brl(tb-pagoBrl()),"ainda por gastar");}
}

render();

if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(function(a){
    if(a&&typeof a.publish==="function"){API=a;renderSave();}
  },function(){});
}
})();
</script>
